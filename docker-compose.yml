services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: decisionops
      MINIO_ROOT_PASSWORD: decisionops-demo
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  pipeline:
    build: .
    command: python -m orchestration.run_pipeline --days 60 --fans 1500
    env_file: .env.example
    volumes:
      - .:/app

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - pipeline

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env.example
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  minio_data:


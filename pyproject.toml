[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-football-club-decisionops-lakehouse"
version = "0.1.0"
description = "Portfolio-grade forward-deployed Azure Databricks lakehouse for a fictional elite football club."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Portfolio Project Candidate" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pandas>=2.2.0",
  "plotly>=5.22.0",
  "streamlit>=1.36.0",
  "pyyaml>=6.0.0",
  "great-expectations>=1.0.0",
  "mlflow>=2.14.0",
  "duckdb>=1.0.0",
]

[project.optional-dependencies]
spark = [
  "pyspark>=3.5.0",
  "delta-spark>=3.2.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "ai_assistant*",
  "api*",
  "data_generator*",
  "dashboard*",
  "ingestion*",
  "lakehouse*",
  "monitoring*",
  "orchestration*",
  "quality*",
  "transformations*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
ignore_errors = true
exclude = ["data/", "lakehouse_local/", "mlruns/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
